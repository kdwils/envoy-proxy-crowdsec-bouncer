name: Functional Tests
on:
  push:
    branches:
      - "**"
    paths:
      - "**.go"

permissions:
  contents: read

jobs:
  functional-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Run functional tests
        run: go test -v -tags=functional -timeout 30m ./tests/functional
