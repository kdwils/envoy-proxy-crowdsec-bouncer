name: releaser

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write
  packages: write
concurrency:
  group: goreleaser
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Re-tag image with version
        run: |
          docker buildx imagetools create \
            ghcr.io/${{ github.repository_owner }}/envoy-proxy-bouncer:sha-${{ github.sha }} \
            --tag ghcr.io/${{ github.repository_owner }}/envoy-proxy-bouncer:${{ github.ref_name }}

  charts:
    needs: [tag]
    uses: kdwils/homelab-workflow/.github/workflows/helm-publish-oci.yml@main
    with:
      charts_dir: charts/envoy-proxy-bouncer

  goreleaser:
    needs: [tag]
    if: "!contains(github.ref, '-rc')"
    uses: kdwils/homelab-workflow/.github/workflows/go-releaser.yml@main
    secrets: inherit
