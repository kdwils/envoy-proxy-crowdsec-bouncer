name: helm-publish

on:
  workflow_call:
    inputs:
      charts_dir:
        required: true
        type: string
      oci_registry:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Login to OCI Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.oci_registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Push Chart
        env:
          CHARTS_DIR: ${{ inputs.charts_dir }}
          OCI_REGISTRY: ${{ inputs.oci_registry }}
        run: |
          OUT=$(mktemp -d)
          helm package "$CHARTS_DIR" --destination "$OUT"
          helm push "$OUT"/*.tgz "oci://$OCI_REGISTRY/${{ github.repository_owner }}/charts"
