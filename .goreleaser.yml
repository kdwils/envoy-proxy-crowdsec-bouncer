# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./main.go
    binary: envoy-proxy-bouncer

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  use: github
  sort: asc
  format: "{{ .Message }} (@{{ .AuthorUsername }})"
  filters:
    exclude:
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
      - "^typo"
      - "^verbiage"
      - "^remove typo"
      - "^remove optional tag"
      - "^version bumps"
  groups:
    - title: "Features"
      regexp: "^(Feature|feature|feat).*?$"
      order: 0
    - title: "Bug Fixes"
      regexp: "^(Bugfix|bugfix|fix).*?$"
      order: 1
    - title: "Documentation"
      regexp: "^(Docs|docs|documentation).*?$"
      order: 2
    - title: "Maintenance"
      regexp: "^(Chore|chore).*?$"
      order: 3
    - title: "Dependency Updates"
      regexp: "^(Bump|bump).*?$"
      order: 4
    - title: "Other Changes"
      order: 999

release:
  github:
    owner: kdwils
    name: envoy-proxy-crowdsec-bouncer
  header: |
    # New Features
    ### AppSec bot challenge
    * Added support for CrowdSec's AppSec `challenge` action (browser fingerprint / proof-of-work). See [CrowdSec's docs](https://doc.crowdsec.net/docs/next/appsec/bot_detection/enable/) to enable it in CrowdSec, and [docs/CROWDSEC.md](https://github.com/kdwils/envoy-proxy-crowdsec-bouncer/blob/main/docs/CROWDSEC.md#waf--appsec) for the bouncer's implementation.
    * **Requires [Request Body Forwarding](https://github.com/kdwils/envoy-proxy-crowdsec-bouncer/blob/main/docs/DEPLOYMENT.md#request-body-forwarding) (`bodyToExtAuth`)** — without it the challenge response never reaches AppSec and every challenge fails.
    * `bouncer_requests_total` and `bouncer_waf_requests_total` now track a `challenge` outcome. See [docs/METRICS.md](https://github.com/kdwils/envoy-proxy-crowdsec-bouncer/blob/main/docs/METRICS.md).

    ### Per-host AppSec routing
    * Added route configurations to send requests to different AppSec listeners or paths by host. See [docs/CONFIGURATION.md](https://github.com/kdwils/envoy-proxy-crowdsec-bouncer/blob/main/docs/CONFIGURATION.md#waf) for configuration details.
    * Combine this with the bot challenge above to scope bot protection (or other configurations) to specific hosts.
      ```yaml
      acquisitions:
        - source: appsec
          listen_addr: "0.0.0.0:7423"
          path: /
          appsec_configs:
            - crowdsecurity/virtual-patching
          labels:
            type: appsec
        - source: appsec
          listen_addr: "0.0.0.0:7422"
          path: /
          appsec_configs:
            - crowdsecurity/virtual-patching
            - crowdsecurity/appsec-bot-*
          labels:
            type: appsec
      ```

    ### Helm chart
    * Config/template value changes now trigger automatic pod restarts via `checksum/config` and `checksum/templates` annotations.

  footer: |
    **Full Changelog**: https://github.com/kdwils/envoy-proxy-crowdsec-bouncer/compare/{{ .PreviousTag }}...{{ .Tag }}
